# Desk settings. Copy to ~/.config/desk/config.toml (or point $DESK_CONFIG at
# another path). Every key is optional; the values shown are the defaults.

# Directory whose immediate children are the git repos the board reads.
repos_dir = "~/Developer"

# Repo preselected when `a` on a TODO card asks which repo to start in.
default_repo = ""

[linear]
# Preferred: send Linear queries through linear-cli (github.com/nesszer/linear-cli),
# which uses its own login (`linear-cli auth oauth` or `linear-cli auth login`).
# cli = "linear-cli"

# Without cli, the API key comes from $LINEAR_API_KEY, else from the output of this command.
# On macOS the default reads the keychain item with service "linear-api":
#   security add-generic-password -s linear-api -a "$USER" -w <key>
# Elsewhere there is no default; for example: key_command = "pass show linear/api-key"
# key_command = "security find-generic-password -s linear-api -w"

# Workspace slug in issue URLs (linear.app/<workspace>/issue/...). Read from
# Linear when empty.
workspace = ""

# Team keys that mark ticket identifiers in branch names and PR titles, such
# as "ENG" for ENG-123. Every team in the workspace when empty.
ticket_prefixes = []

[github]
# Also show PRs that request a review from a team you are on. Off: only
# requests to you by name.
team_review_requests = false

[agent]
# Herdr agent kind that `a` starts.
kind = "claude"

# First prompt for a session started on a Linear issue. Fields: {id} {title}
# {url} {branch}. The default names the issue and says the branch is Linear's.
# brief = """
# Start work on Linear issue {id}: {title}
# {url}
# """

# Briefs for a card that already has a PR, which `a` and `f` choose by its state.
# fix_brief is the frame, and {tasks} in it becomes fix_conflicts, fix_checks
# and fix_reviews (review comments on the current commit, or changes requested),
# numbered when more than one applies; `f` sends only the first two. An open PR
# with none of these gets resume_brief, which orients the agent and asks for
# instructions. Fields: {number} {url} {branch} {base} {repo} {reviewers}
# {issue}, and {state} in resume_brief. See config.py for the defaults.
# fix_brief = "PR #{number} on {branch}: {url}{issue}\n\n{tasks}\n\nThen run the tests and push."
# fix_conflicts = "..."
# fix_checks = "..."
# fix_reviews = "..."
# resume_brief = "..."

[commands]
# `v`: reviews a PR. Called with two arguments, <owner/repo> <number>.
# review = "bash ~/bin/review-pr.sh"

# `T`: closes stale sessions. Called with --dry-run first to preview; must print
# one "close <workspace>" line per workspace it closes.
# tidy = "~/.local/bin/desk-tidy"
# Log the tidy command writes resume lines to, shown after it runs.
# tidy_log = "~/.local/state/desk/tidy.log"
