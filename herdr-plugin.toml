id = "desk"
name = "Desk"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Board of your live work: agents, worktrees and PRs, sorted into todo / your move / working / waiting / mergeable / landed"
platforms = ["macos", "linux"]

# On `herdr plugin install`, create .venv with the pinned Textual. `herdr plugin link`
# skips build steps: run ./install.sh yourself in a local checkout.
[[build]]
command = ["bash", "install.sh"]

[[actions]]
id = "open"
title = "Desk: show the board"
contexts = ["workspace", "global"]
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/open.sh\""]

[[panes]]
id = "board"
title = "Desk"
placement = "tab"
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/desk\""]
